<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{with .Track.Name}}{{.}} · {{end}}retrace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <!-- Inlined rather than fetched, since fetch fails for a page opened from a file. -->
  <script id="data" type="application/json">{{.JSON}}</script>
  <!-- Deferred scripts run in this order; app.js uses the other three. -->
  <script src="assets/format.js" defer></script>
  <script src="assets/track.js" defer></script>
  <script src="assets/timeline.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <!-- The × of the photo panel and the popup, added by app.js. -->
  <template id="close-button">
    <button type="button" class="icon-button close" aria-label="Close the photo" title="Close (Esc)">
      <svg class="stroked" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 4.5l11 11M15.5 4.5l-11 11"/></svg>
    </button>
  </template>
  <main>
    <div id="map"></div>
    <div class="dock">
      <figure id="panel" hidden>
        <div class="frames"><img alt=""><img alt=""></div>
        <figcaption></figcaption>
      </figure>
      <div class="bar" role="group" aria-label="Photos">
        <div class="profile">
          <svg preserveAspectRatio="none" aria-hidden="true">
            <path class="ground"></path>
            <path class="line"></path>
            <path class="ticks ticks-exif"></path>
            <path class="ticks ticks-interpolated"></path>
            <path class="ticks ticks-track_end"></path>
            <line class="playhead" y1="0" y2="100%"></line>
          </svg>
          <input type="range" id="scrub" min="0" value="0" step="any" aria-label="Position on the track" title="Drag to a photo">
          <div class="handle"></div>
        </div>
        <div class="controls">
          <button type="button" class="icon-button" id="previous" aria-label="Previous photo" title="Previous photo (←)" disabled>
            <svg class="stroked" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
          </button>
          <button type="button" class="icon-button" id="play" aria-label="Play" title="Play (Space)">
            <svg class="play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.5v11l9-5.5z"/></svg>
            <svg class="pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4.5h2.75v11H6zM11.25 4.5H14v11h-2.75z"/></svg>
          </button>
          <button type="button" class="icon-button" id="next" aria-label="Next photo" title="Next photo (→)">
            <svg class="stroked" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
          </button>
          <span id="bar-label" aria-live="polite"></span>
          <div class="toggle" role="group" aria-label="Photo size" title="Adjust photo size">
            <button type="button" data-size="s">S</button><button type="button" data-size="m">M</button><button type="button" data-size="l">L</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <aside>
    <header>
      <h1>{{or .Track.Name "Untitled hike"}}</h1>
      <p id="stats"></p>
      {{with .Track.Creator}}<p class="muted">Recorded with {{.}}</p>{{end}}
      {{with .Copyright}}<p class="muted">{{.}}</p>{{end}}
      <div class="row">
        <ul class="legend">
          <li><span class="pin pin-exif"></span> Photo's GPS</li>
          <li><span class="pin pin-interpolated"></span> On the track by time</li>
          <li><span class="pin pin-track_end"></span> Before or after the track</li>
        </ul>
        <div class="toggle" role="group" aria-label="Units">
          <button type="button" data-units="metric">km</button><button type="button" data-units="imperial">mi</button>
        </div>
      </div>
    </header>
    <ol id="photos" class="photos"></ol>
    <section id="unlocated" hidden>
      <h2>Not on the map</h2>
      <p class="muted">retrace found no GPS or capture time in these photos.</p>
      <ol class="photos"></ol>
    </section>
  </aside>
</body>
</html>
