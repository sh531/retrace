version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - errorlint # wrapped errors must be checked with errors.Is/As
    - gosec
    - revive
  settings:
    errcheck:
      exclude-functions:
        # Its first error is kept and returned by Flush, which is checked (bufio.go).
        - (*bufio.Writer).Write
    gosec:
      excludes:
        # Unchecked errors: errcheck checks the same, and its exclusions above work.
        - G104
        # Local CLI will read user-supplied photo and GPX paths.
        - G304
  exclusions:
    rules:
      # Test helpers convert the lengths of small, hard-coded inputs.
      - path: _test\.go
        text: G115
        linters:
          - gosec
